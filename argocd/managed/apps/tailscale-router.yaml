apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-router
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/robinjoon-homelab/Simple-K3S-Herness.git
    targetRevision: main
    path: infrastructure/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # App-of-Apps waves alone do not wait for the child Operator's CRDs.
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
