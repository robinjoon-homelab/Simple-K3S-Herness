apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sms-secret-access
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robinjoon-homelab/Simple-K3S-Herness.git
    targetRevision: main
    path: infrastructure/sms-secret-access
  destination:
    server: https://kubernetes.default.svc
    namespace: sms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
