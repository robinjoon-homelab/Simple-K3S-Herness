apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.102.4
    helm:
      valuesObject:
        # Credentials are registered separately; never put oauth values in Git.
        oauthSecretVolume:
          secret:
            secretName: operator-oauth
        operatorConfig:
          hostname: homelab-operator
        ingressClass:
          enabled: false
        apiServerProxyConfig:
          mode: "false"
          allowImpersonation: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
