{{- if eq .Values.workload.kind "deployment" }}
{{- $egressEnabled := include "homelab.egress.enabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.metadata.name | quote }}
  namespace: {{ .Values.metadata.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.metadata.name | quote }}
spec:
  replicas: {{ if hasKey .Values.workload "replicas" }}{{ .Values.workload.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.metadata.name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.metadata.name | quote }}
        {{- if $egressEnabled }}
        simple-k3s-harness.dev/egress-proxy: required
        {{- end }}
    spec:
      {{- with .Values.workload.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with .Values.workload.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ .name | quote }}
      {{- end }}
      {{- end }}
      {{- if $egressEnabled }}
      initContainers:
        - name: platform-egress-trust
          image: {{ .Values.platform.egress.trustToolsImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- .Files.Get "files/build-egress-trust.sh" | nindent 14 }}
            - build-egress-trust
            - /ca/ca.crt
            - /trust/inspection.p12
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: platform-egress-ca
              mountPath: /ca
              readOnly: true
            - name: platform-egress-trust
              mountPath: /trust
      {{- end }}
      containers:
      {{- range .Values.workload.containers }}
        - name: {{ .name | quote }}
          image: {{ printf "%s:%s" .image.repository .image.tag | quote }}
          {{- if .ports }}
          ports:
          {{- range .ports }}
            - name: {{ .name | quote }}
              containerPort: {{ .containerPort }}
          {{- end }}
          {{- end }}
          {{- if or $egressEnabled $.Values.database .env }}
          env:
          {{- if $egressEnabled }}
            {{- include "homelab.egress.env" $ | nindent 12 }}
          {{- end }}
          {{- if $.Values.database }}
            - name: DB_HOST
              value: {{ required "platform.database.host is required when database is declared" $.Values.platform.database.host | quote }}
          {{- end }}
          {{- range .env }}
            {{- if and $egressEnabled (has .name (list "HTTPS_PROXY" "https_proxy" "HTTP_PROXY" "http_proxy" "ALL_PROXY" "all_proxy" "NO_PROXY" "no_proxy" "SSL_CERT_FILE" "SSL_CERT_DIR" "REQUESTS_CA_BUNDLE" "CURL_CA_BUNDLE" "JAVA_TOOL_OPTIONS")) }}
              {{- fail "egress proxy and trust environment variables are managed by the platform" }}
            {{- end }}
            {{- if and $.Values.database (eq .name "DB_HOST") }}
              {{- fail "DB_HOST is managed by the platform when database is declared" }}
            {{- end }}
            {{- if and $.Values.database .secretKeyRef (eq .secretKeyRef.name "shared-db-app") (not (has .secretKeyRef.key (list "port" "username" "password"))) }}
              {{- fail "shared-db-app may only supply port, username, and password to database workloads" }}
            {{- end }}
            - name: {{ .name | quote }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- end }}
              {{- if .secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name | quote }}
                  key: {{ .secretKeyRef.key | quote }}
              {{- end }}
              {{- if .configMapKeyRef }}
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-%s" $.Values.metadata.name .configMapKeyRef.name | quote }}
                  key: {{ .configMapKeyRef.key | quote }}
              {{- end }}
          {{- end }}
          {{- end }}
          {{- if .envFrom }}
          envFrom:
          {{- range .envFrom }}
            {{- if and $.Values.database .secretRef (eq .secretRef.name "shared-db-app") }}
              {{- fail "shared-db-app may only supply port, username, and password to database workloads" }}
            {{- end }}
            {{- if .configMapRef }}
            - configMapRef:
                name: {{ printf "%s-%s" $.Values.metadata.name .configMapRef.name | quote }}
            {{- end }}
            {{- if .secretRef }}
            - secretRef:
                name: {{ .secretRef.name | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if or $egressEnabled .volumeMounts }}
          volumeMounts:
          {{- if $egressEnabled }}
            - name: platform-egress-ca
              mountPath: /etc/platform-egress-ca
              readOnly: true
            - name: platform-egress-trust
              mountPath: /etc/platform-egress-trust
              readOnly: true
          {{- end }}
          {{- range .volumeMounts }}
            - name: {{ .name | quote }}
              mountPath: {{ .mountPath | quote }}
              {{- if .subPath }}
              subPath: {{ .subPath | quote }}
              {{- end }}
              {{- if hasKey . "readOnly" }}
              readOnly: {{ .readOnly }}
              {{- end }}
          {{- end }}
          {{- end }}
      {{- end }}
      {{- if or $egressEnabled .Values.workload.volumes }}
      volumes:
      {{- if $egressEnabled }}
        - name: platform-egress-ca
          secret:
            secretName: {{ .Values.platform.egress.caSecretName | quote }}
            defaultMode: 0444
        - name: platform-egress-trust
          emptyDir:
            sizeLimit: 8Mi
      {{- end }}
      {{- range .Values.workload.volumes }}
        {{- if and $egressEnabled (has .name (list "platform-egress-ca" "platform-egress-trust")) }}
          {{- fail "egress CA and trust volumes are managed by the platform" }}
        {{- end }}
        {{- if and $.Values.database .secret (eq .secret.secretName "shared-db-app") }}
          {{- fail "shared-db-app may only supply port, username, and password to database workloads" }}
        {{- end }}
        - name: {{ .name | quote }}
          {{- if .configMap }}
          configMap:
            name: {{ printf "%s-%s" $.Values.metadata.name .configMap.name | quote }}
          {{- end }}
          {{- if .secret }}
          secret:
            secretName: {{ .secret.secretName | quote }}
          {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
