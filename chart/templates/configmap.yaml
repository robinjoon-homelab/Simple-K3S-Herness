{{- range .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" $.Values.metadata.name .name | quote }}
  namespace: {{ $.Values.metadata.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ $.Values.metadata.name | quote }}
{{- if .data }}
data:
  {{- range $key, $val := .data }}
  {{ $key | quote }}: {{ $val | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
