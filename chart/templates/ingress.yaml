{{- $names := dict }}
{{- range .Values.ingresses }}
{{- $tls := .tls | default dict }}
{{- if ne (get $tls "mode") "cert-manager" }}
{{- fail "Every workload ingress requires tls.mode=cert-manager; HTTP application access is not supported." }}
{{- end }}
{{- $name := printf "%s-%s" $.Values.metadata.name .name }}
{{- if hasKey $names $name }}
{{- fail (printf "Duplicate Ingress name: %s" $name) }}
{{- end }}
{{- $_ := set $names $name true }}
{{- end }}
{{- range .Values.ingresses }}
{{- $ingress := . }}
{{- $name := printf "%s-%s" $.Values.metadata.name .name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Values.metadata.namespace | quote }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
      {{- range .rules }}
        - {{ .host | quote }}
      {{- end }}
      secretName: {{ printf "%s-tls" $name | quote }}
  rules:
  {{- range .rules }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" $.Values.metadata.name $ingress.service | quote }}
                port:
                  name: {{ .servicePort | quote }}
        {{- end }}
  {{- end }}
{{- end }}
