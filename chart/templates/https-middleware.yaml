{{- if .Values.ingresses }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ printf "%s-http-scheme" .Values.metadata.name | quote }}
  namespace: {{ .Values.metadata.namespace | quote }}
spec:
  headers:
    # This middleware is only attached to the HTTP entrypoint. Do not let a
    # forwarded scheme make RedirectScheme pass a plaintext request to the app.
    customRequestHeaders:
      X-Forwarded-Proto: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ printf "%s-https-redirect" .Values.metadata.name | quote }}
  namespace: {{ .Values.metadata.namespace | quote }}
spec:
  redirectScheme:
    scheme: https
    port: "443"
    permanent: true
{{- end }}
