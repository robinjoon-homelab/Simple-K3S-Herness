apiVersion: v1
kind: ServiceAccount
metadata:
  name: sms-secret-manager
  namespace: sms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sms-secret-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sms-secret-manager
subjects:
  - kind: ServiceAccount
    name: sms-secret-manager
    namespace: sms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sms-secret-manager
