# 앱 온보딩 전에 경로 강제와 차단 범위를 시험하는 전용 네임스페이스다. 평소에는 Pod가 없다.
apiVersion: v1
kind: Namespace
metadata:
  name: egress-proxy-canary
  labels:
    # Reflector가 egress-proxy-public-ca를 복제하도록 워크로드 라벨을 붙인다.
    simple-k3s-harness.dev/workload: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: route-through-egress-proxy
  namespace: egress-proxy-canary
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: central-egress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
