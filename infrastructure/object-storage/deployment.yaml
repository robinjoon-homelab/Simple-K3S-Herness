apiVersion: apps/v1
kind: Deployment
metadata:
  name: juicefs-gateway
  namespace: storage-system
spec:
  replicas: 1
  # ReadWriteOnce는 같은 노드의 두 Pod가 함께 마운트할 수 있으므로 이전 Pod를 먼저 내린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: juicefs-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: juicefs-gateway
    spec:
      initContainers:
        - name: format
          image: juicedata/mount:ce-v1.4.2
          imagePullPolicy: IfNotPresent
          command:
            - juicefs
            - format
            - --no-update
            - --storage=file
            - --bucket=/nas/juicefs/
            - $(META_URL)
            - homelab
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-db-app
                  key: username
            - name: META_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-db-app
                  key: password
            - name: META_URL
              value: postgres://$(DB_USER)@shared-db-rw.database-system.svc.cluster.local:5432/juicefs
          volumeMounts:
            - name: nas
              mountPath: /nas
      containers:
        - name: gateway
          image: juicedata/mount:ce-v1.4.2
          imagePullPolicy: IfNotPresent
          command:
            - juicefs
            - gateway
            - --multi-buckets
            - --keep-etag
            - --writeback
            - --cache-dir=/cache
            - --cache-size=20480
            - --no-usage-report
            - $(META_URL)
            - 0.0.0.0:9000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-db-app
                  key: username
            - name: META_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-db-app
                  key: password
            - name: META_URL
              value: postgres://$(DB_USER)@shared-db-rw.database-system.svc.cluster.local:5432/juicefs
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: juicefs-gateway-auth
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: juicefs-gateway-auth
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: s3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: nas
              mountPath: /nas
            - name: cache
              mountPath: /cache
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: juicefs-nas
        - name: cache
          persistentVolumeClaim:
            claimName: juicefs-cache
